# CI/CD Pipeline: Continuous Integration, Testing, Inspection, and Deployment
# Workflow components: Build → Test → SonarQube Analysis → Package → Deploy

name: Maven CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # STAGE 1: CONTINUOUS INTEGRATION - Build the project
  build:
    name: Continuous Integration - Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Clean project
      run: mvn clean

    - name: Compile source code
      run: mvn compile

    - name: Build success - Compilation complete
      if: success()
      run: echo "✅ Stage 1: Continuous Integration - Compilation successful!"

    - name: Build failure - Compilation failed
      if: failure()
      run: echo "❌ Stage 1: Continuous Integration - Compilation failed!"

  # STAGE 2: CONTINUOUS TESTING - Run unit and integration tests
  test:
    name: Continuous Testing - Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Compile test code
      run: mvn test-compile

    - name: Run unit tests
      run: mvn test

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Test success notification
      if: success()
      run: echo "✅ Stage 2: Continuous Testing - All tests passed!"

    - name: Test failure notification
      if: failure()
      run: echo "❌ Stage 2: Continuous Testing - Tests failed!"

  # STAGE 3: CONTINUOUS INSPECTION - Code quality analysis with SonarQube
  inspect:
    name: Continuous Inspection - SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build and analyze with SonarQube
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn verify sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=jauharfz -Dsonar.projectKey=jauharfz_Counter

    - name: Inspection success notification
      if: success()
      run: echo "✅ Stage 3: Continuous Inspection - Code quality analysis passed!"

    - name: Inspection failure notification
      if: failure()
      run: echo "❌ Stage 3: Continuous Inspection - Code quality analysis failed!"

  # STAGE 4: CONTINUOUS DEPLOYMENT/DELIVERY - Package and release artifact
  deploy:
    name: Continuous Deployment/Delivery - Release
    runs-on: ubuntu-latest
    needs: inspect
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Package application
      run: mvn package -DskipTests

    - name: Upload artifact to GitHub Releases
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact as build artifact
      uses: actions/upload-artifact@v3
      with:
        name: application-build
        path: target/*.jar

    - name: Deployment success notification
      if: success()
      run: echo "✅ Stage 4: Continuous Deployment/Delivery - Application packaged and released!"

    - name: Deployment failure notification
      if: failure()
      run: echo "❌ Stage 4: Continuous Deployment/Delivery - Packaging failed!"
